name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod


      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Default token publishes the GitHub release + assets.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to tiny-systems/homebrew-tap so the
          # formula can be pushed there. Add it as a repo secret.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # The krew manifest for this release, with the real checksums, as a
      # release asset: `kubectl krew install --manifest-url=<it>` installs
      # from it, and it is what krew-index receives.
      - name: Attach the krew manifest
        run: |
          go run ./hack/krewmanifest -tag "$GITHUB_REF_NAME" -checksums dist/checksums.txt > tiny-krew.yaml
          gh release upload "$GITHUB_REF_NAME" tiny-krew.yaml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opens the version-bump PR in kubernetes-sigs/krew-index from
      # .krew.yaml, so `kubectl krew upgrade tiny-agents` sees the release. The
      # index only accepts these for a plugin it already lists; the first
      # submission must be a PR opened by a person (the bot's attempt was
      # closed). So it runs only once the repo variable KREW_INDEXED is
      # "true", set after the plugin is accepted. A failure never fails the
      # release. Pinned to v0.0.51 by commit.
      - name: Update the krew index
        if: vars.KREW_INDEXED == 'true'
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3
        continue-on-error: true
